# This is a Databricks asset bundle definition for dt_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dt_bundle
  uuid: 43684d8c-c54d-4715-8a0d-c269fc38569c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  warehouse_id:
    description: The warehouse to use
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7a41d30e-1947.cloud.databricks.com
    variables:
      warehouse_id: 4491a9932239059b
      catalog: workspace
      schema: ${workspace.current_user.short_name}

  prod:
    mode: production
    workspace:
      host: https://dbc-7a41d30e-1947.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/animeshgupta9112@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/animeshgupta9112@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      warehouse_id: 4491a9932239059b
      catalog: workspace
      schema: default
    permissions:
      - user_name: animeshgupta9112@gmail.com
        level: CAN_MANAGE
